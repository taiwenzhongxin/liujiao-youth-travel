<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>職人故事管理後台 ｜ 嘉義青年壯遊</title>
    
    <link rel="stylesheet" href="css/common.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@300;400;500;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body.admin-body {
            background-color: #F8F7F4;
            color: #1A1A1A;
            margin: 0;
            padding: 40px 20px;
            font-family: 'Noto Sans TC', sans-serif;
        }
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            border-bottom: 2px solid #E5E0D8;
            padding-bottom: 16px;
        }
        .admin-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.8rem;
            font-weight: 900;
            margin: 0;
            color: #111111;
        }
        .admin-actions {
            display: flex;
            gap: 12px;
        }
        .btn-admin-primary {
            background-color: #D96328;
            color: #FFFFFF;
            border: none;
            padding: 10px 20px;
            border-radius: 999px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .btn-admin-primary:hover {
            background-color: #B84E1B;
        }
        .btn-admin-secondary {
            background-color: transparent;
            color: #4A463F;
            border: 1px solid #D8D2C6;
            padding: 10px 20px;
            border-radius: 999px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .btn-admin-secondary:hover {
            background-color: #FAF8F5;
            border-color: #111111;
        }
        .artisans-table-card {
            background: #FFFFFF;
            border-radius: 12px;
            border: 1px solid #ECE7DE;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            overflow: hidden;
        }
        table.admin-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }
        table.admin-table th, table.admin-table td {
            padding: 16px 20px;
            border-bottom: 1px solid #F0ECE4;
            vertical-align: middle;
        }
        table.admin-table th {
            background-color: #FAF8F5;
            font-weight: 700;
            color: #555047;
            letter-spacing: 0.5px;
        }
        table.admin-table tr:last-child td {
            border-bottom: none;
        }
        .badge-town {
            background: #F0EDE6;
            color: #6E685F;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .badge-cat {
            background: #FDEEE6;
            color: #D96328;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .btn-danger {
            background: #C0392B;
            color: #FFFFFF;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-danger:hover {
            background: #962D22;
        }
        .btn-edit {
            background: #27AE60;
            color: #FFFFFF;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-edit:hover {
            background: #1E8449;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #8C867C;
        }

        /* 彈窗卡片樣式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            overflow-y: auto;
            padding: 20px 0;
        }
        .modal-card {
            background: #FFFFFF;
            width: 100%;
            max-width: 700px;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            box-sizing: border-box;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-card h3 {
            margin-top: 0;
            font-family: 'Noto Serif TC', serif;
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #111;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: #4A463F;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #D8D2C6;
            border-radius: 8px;
            font-size: 0.9rem;
            box-sizing: border-box;
            font-family: inherit;
        }
        .form-group textarea {
            resize: vertical;
            height: 70px;
        }
        
        /* Q&A 區塊專屬樣式 */
        .qa-builder-section {
            background: #FAF8F5;
            border: 1px solid #E5E0D8;
            border-radius: 10px;
            padding: 16px;
            margin-top: 20px;
        }
        .qa-pair-box {
            background: #FFFFFF;
            border: 1px solid #D8D2C6;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            position: relative;
        }
        .btn-remove-qa {
            background: #C0392B;
            color: white;
            border: none;
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            float: right;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body class="admin-body">

    <div class="admin-container">
        <div class="admin-header">
            <div>
                <span style="font-size: 0.75rem; font-weight: 800; letter-spacing: 2px; color: #D96328;">ADMIN CONTROL PANEL</span>
                <h1 class="admin-title">職人故事管理後台</h1>
            </div>
            <div class="admin-actions">
                <a href="admin.html" class="btn-admin-secondary">← 返回總後台</a>
                <a href="journal.html" class="btn-admin-secondary" target="_blank">檢視職人 ↗</a>
                <button class="btn-admin-primary" id="btnAddArtisan">＋ 新增職人專訪</button>
                <button class="btn-admin-secondary" id="logoutBtn" style="color: #C0392B; border-color: #C0392B;">登出</button>
            </div>
        </div>

        <div class="artisans-table-card">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th style="width: 70px;">照片</th>
                        <th style="width: 80px;">編號</th>
                        <th style="width: 100px;">鄉鎮 / 分類</th>
                        <th>職人姓名與頭銜</th>
                        <th style="width: 130px; text-align: right;">操作</th>
                    </tr>
                </thead>
                <tbody id="artisansTableBody">
                    <tr>
                        <td colspan="5" class="empty-state">正在驗證身分並載入職人專訪資料...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 互動卡片彈窗 (Modal) -->
    <div class="modal-overlay" id="artisanModal">
        <div class="modal-card">
            <h3 id="modalTitle">新增職人專訪</h3>
            <form id="artisanForm">
                <div style="display: flex; gap: 12px;">
                    <div class="form-group" style="flex: 1;">
                        <label>職人英文代碼 ID (例如 huang_xianzhang)</label>
                        <input type="text" id="artisanIdInput" required placeholder="例如 huang_zheyong">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>編號 (例如 01)</label>
                        <input type="text" id="artisanIndexInput" required placeholder="01">
                    </div>
                </div>
                <div style="display: flex; gap: 12px;">
                    <div class="form-group" style="flex: 1;">
                        <label>鄉鎮 (例如 六腳鄉)</label>
                        <input type="text" id="artisanTownInput" required placeholder="六腳鄉">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>分類名稱</label>
                        <select id="artisanCatNameInput" required style="width: 100%; padding: 8px 12px; border: 1px solid #D8D2C6; border-radius: 8px; font-size: 0.9rem; box-sizing: border-box; font-family: inherit; background-color: #FFFFFF; color: #1A1A1A; cursor: pointer;">
                            <option value="傳統技藝">傳統技藝</option>
                            <option value="地方創生">地方創生</option>
                        </select>
                    </div>
                </div>
                <div style="display: flex; gap: 12px;">
                    <div class="form-group" style="flex: 1;">
                        <label>分類代碼</label>
                        <select id="artisanCatInput" required style="width: 100%; padding: 8px 12px; border: 1px solid #D8D2C6; border-radius: 8px; font-size: 0.9rem; box-sizing: border-box; font-family: inherit; background-color: #FFFFFF; color: #1A1A1A; cursor: pointer;">
                            <option value="CRAFT">傳統技藝 (CRAFT)</option>
                            <option value="REVITALIZATION">地方創生 (REVITALIZATION)</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>職人姓名</label>
                        <input type="text" id="artisanNameInput" required placeholder="請輸入姓名">
                    </div>
                </div>
                <div class="form-group">
                    <label>職人頭銜 (Role)</label>
                    <input type="text" id="artisanRoleInput" required placeholder="例如 國寶級懸絲偶技師 ｜ 立青工作室創辦人">
                </div>
                <div class="form-group">
                    <label>核心代表金句 (Quote)</label>
                    <textarea id="artisanQuoteInput" placeholder="請輸入金句..."></textarea>
                </div>
                <div class="form-group">
                    <label>職人生平介紹 (Bio)</label>
                    <textarea id="artisanBioInput" placeholder="請輸入生平與在地深耕介紹..."></textarea>
                </div>
                <div class="form-group">
                    <label>職人代表照片 (上傳圖檔)</label>
                    <input type="file" id="artisanImageFile" accept="image/*">
                </div>

                <!-- 訪談 Q&A 動態管理區塊 -->
                <div class="qa-builder-section">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <label style="margin: 0; font-size: 0.95rem; color: #D96328; font-weight: 800;">訪談 Q&A 問答管理</label>
                        <button type="button" class="btn-admin-primary" id="btnAddQaItem" style="padding: 4px 12px; font-size: 0.8rem;">＋ 新增問題</button>
                    </div>
                    <div id="qaListContainer">
                        <!-- 動態產生的 Q&A 編輯卡片會在這裡展開 -->
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-admin-secondary" id="closeModalBtn">取消</button>
                    <button type="submit" class="btn-admin-primary" id="saveArtisanBtn">儲存資料</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://jgidphbpizkladzzamyz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_miYTEZasCg_uBNOd0wlwNw_dwcP-hJk';
        window.db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isEditing = false;
        let currentImageUrl = '';

        async function checkAuthAndFetch() {
            const { data: { session } } = await window.db.auth.getSession();
            if (!session) {
                alert('您尚未登入或登入已過期，請先登入後台！');
                window.location.href = 'login.html';
                return;
            }
            fetchArtisans();
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await window.db.auth.signOut();
            window.location.href = 'login.html';
        });

        async function fetchArtisans() {
            const tbody = document.getElementById('artisansTableBody');
            const { data, error } = await window.db
                .from('artisans')
                .select('*')
                .order('index_num', { ascending: true });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="5" class="empty-state" style="color: #C0392B;">載入失敗：${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="empty-state">目前尚無任何職人專訪資料。</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(item => `
                <tr>
                    <td>
                        ${item.hero_img ? `<img src="${item.hero_img}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 6px;" alt="頭像">` : `<span style="color: #ccc; font-size: 0.8rem;">無圖</span>`}
                    </td>
                    <td><code>${item.index_num || '01'}</code></td>
                    <td>
                        <span class="badge-town">${item.town || ''}</span><br>
                        <span class="badge-cat" style="margin-top: 4px; display: inline-block;">${item.category_name || item.category || ''}</span>
                    </td>
                    <td>
                        <strong style="font-size: 1rem; display: block; margin-bottom: 4px;"><a href="artisan-detail.html?id=${item.id}" target="_blank" style="color: #111111; text-decoration: none;">${item.name} ↗</a></strong>
                        <span style="color: #6E685F; font-size: 0.82rem; display: block; line-height: 1.4;">${item.role || item.title || ''}</span>
                    </td>
                    <td style="text-align: right;">
                        <button class="btn-edit" onclick="openEditModal('${item.id}')">修改</button>
                        <button class="btn-danger" onclick="deleteArtisan('${item.id}')">刪除</button>
                    </td>
                </tr>
            `).join('');
        }

        window.deleteArtisan = async function(id) {
            if (!confirm(`確定要刪除代碼 [${id}] 的職人專訪嗎？`)) return;
            const { error } = await window.db.from('artisans').delete().eq('id', id);
            if (error) {
                alert('刪除失敗：' + error.message);
            } else {
                alert('刪除成功！');
                fetchArtisans();
            }
        };

        async function uploadFileToStorage(file) {
            if (!file) return null;
            const fileExt = file.name.split('.').pop();
            const fileName = `artisan_${Math.random().toString(36).substring(2)}_${Date.now()}.${fileExt}`;
            const filePath = `artisans-covers/${fileName}`;

            const { error } = await window.db.storage
                .from('spot-images')
                .upload(filePath, file);

            if (error) {
                alert('圖片上傳失敗：' + error.message);
                return null;
            }

            const { data: { publicUrl } } = window.db.storage
                .from('spot-images')
                .getPublicUrl(filePath);

            return publicUrl;
        }

        // Q&A 動態產生與刪除函式
        function renderQaBuilder(qaList = []) {
            const container = document.getElementById('qaListContainer');
            container.innerHTML = '';
            
            qaList.forEach((qa, index) => {
                const box = document.createElement('div');
                box.className = 'qa-pair-box';
                box.innerHTML = `
                    <button type="button" class="btn-remove-qa" onclick="this.closest('.qa-pair-box').remove()">刪除此題</button>
                    <div class="form-group" style="margin-bottom: 8px;">
                        <label>問題 ${index + 1} (Q)</label>
                        <input type="text" class="qa-q-input" value="${qa.q || ''}" placeholder="請輸入訪談問題..." required>
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>回答 (A)</label>
                        <textarea class="qa-a-input" placeholder="請輸入回答內容..." required>${qa.a || ''}</textarea>
                    </div>
                `;
                container.appendChild(box);
            });
        }

        document.getElementById('btnAddQaItem').addEventListener('click', () => {
            const container = document.getElementById('qaListContainer');
            const index = container.children.length;
            const box = document.createElement('div');
            box.className = 'qa-pair-box';
            box.innerHTML = `
                <button type="button" class="btn-remove-qa" onclick="this.closest('.qa-pair-box').remove()">刪除此題</button>
                <div class="form-group" style="margin-bottom: 8px;">
                    <label>問題 ${index + 1} (Q)</label>
                    <input type="text" class="qa-q-input" placeholder="請輸入訪談問題..." required>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>回答 (A)</label>
                    <textarea class="qa-a-input" placeholder="請輸入回答內容..." required></textarea>
                </div>
            `;
            container.appendChild(box);
        });

        const modal = document.getElementById('artisanModal');
        const btnAddArtisan = document.getElementById('btnAddArtisan');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const artisanForm = document.getElementById('artisanForm');

        btnAddArtisan.addEventListener('click', () => {
            isEditing = false;
            currentImageUrl = '';
            document.getElementById('modalTitle').innerText = '新增職人專訪';
            document.getElementById('artisanIdInput').value = '';
            document.getElementById('artisanIdInput').disabled = false;
            document.getElementById('artisanIndexInput').value = '01';
            document.getElementById('artisanTownInput').value = '六腳鄉';
            document.getElementById('artisanCatNameInput').value = '傳統技藝';
            document.getElementById('artisanCatInput').value = 'CRAFT';
            document.getElementById('artisanNameInput').value = '';
            document.getElementById('artisanRoleInput').value = '';
            document.getElementById('artisanQuoteInput').value = '';
            document.getElementById('artisanBioInput').value = '';
            document.getElementById('artisanImageFile').value = '';
            
            // 預設給一個空白問答
            renderQaBuilder([{ q: '', a: '' }]);
            modal.style.display = 'flex';
        });

        window.openEditModal = async function(id) {
            const { data, error } = await window.db.from('artisans').select('*').eq('id', id.trim()).single();
            if (error || !data) {
                alert('找不到該職人資料: ' + (error ? error.message : ''));
                return;
            }

            isEditing = true;
            currentImageUrl = data.hero_img || '';
            document.getElementById('modalTitle').innerText = `修改職人：${data.name}`;
            document.getElementById('artisanIdInput').value = data.id.trim();
            document.getElementById('artisanIdInput').disabled = true;
            document.getElementById('artisanIndexInput').value = data.index_num || '01';
            document.getElementById('artisanTownInput').value = data.town || '';
            document.getElementById('artisanCatNameInput').value = data.category_name || '傳統技藝';
            document.getElementById('artisanCatInput').value = data.category || 'CRAFT';
            document.getElementById('artisanNameInput').value = data.name || '';
            document.getElementById('artisanRoleInput').value = data.role || data.title || '';
            document.getElementById('artisanQuoteInput').value = data.quote || '';
            document.getElementById('artisanBioInput').value = data.bio || '';
            document.getElementById('artisanImageFile').value = '';

            // 渲染該職人的 Q&A 清單
            renderQaBuilder(data.qa_list || []);

            modal.style.display = 'flex';
        };

        closeModalBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        artisanForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('artisanIdInput').value.trim();
            const index_num = document.getElementById('artisanIndexInput').value.trim();
            const town = document.getElementById('artisanTownInput').value.trim();
            const category_name = document.getElementById('artisanCatNameInput').value.trim();
            const category = document.getElementById('artisanCatInput').value.trim();
            const name = document.getElementById('artisanNameInput').value.trim();
            const role = document.getElementById('artisanRoleInput').value.trim();
            const quote = document.getElementById('artisanQuoteInput').value.trim();
            const bio = document.getElementById('artisanBioInput').value.trim();
            const imageFile = document.getElementById('artisanImageFile').files[0];

            // 收集畫面上的 Q&A 資料
            const qaList = [];
            document.querySelectorAll('.qa-pair-box').forEach(box => {
                const q = box.querySelector('.qa-q-input').value.trim();
                const a = box.querySelector('.qa-a-input').value.trim();
                if (q || a) {
                    qaList.push({ q, a });
                }
            });

            let finalImageUrl = currentImageUrl;
            if (imageFile) {
                const uploadedUrl = await uploadFileToStorage(imageFile);
                if (uploadedUrl) finalImageUrl = uploadedUrl;
            }

            const payload = {
                index_num, town, category_name, category, name, role, title: role, quote, bio,
                hero_img: finalImageUrl,
                qa_list: qaList
            };

            if (isEditing) {
                const { error } = await window.db.from('artisans').update(payload).eq('id', id);
                if (error) {
                    alert('修改失敗：' + error.message);
                } else {
                    alert('修改成功！');
                    modal.style.display = 'none';
                    fetchArtisans();
                }
            } else {
                payload.id = id;
                const { error } = await window.db.from('artisans').insert([payload]);
                if (error) {
                    alert('新增失敗或 ID 重複：' + error.message);
                } else {
                    alert('新增成功！');
                    modal.style.display = 'none';
                    fetchArtisans();
                }
            }
        });

        document.addEventListener('DOMContentLoaded', checkAuthAndFetch);
    </script>
</body>
</html>
