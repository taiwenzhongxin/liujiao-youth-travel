<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>走讀路線管理後台 ｜ 嘉義青年壯遊</title>
    
    <link rel="stylesheet" href="css/common.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@300;400;500;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body.admin-body {
            background-color: #F8F7F4;
            color: #1A1A1A;
            margin: 0;
            padding: 40px 20px;
            font-family: 'Noto Sans TC', sans-serif;
        }
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            border-bottom: 2px solid #E5E0D8;
            padding-bottom: 16px;
        }
        .admin-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.8rem;
            font-weight: 900;
            margin: 0;
            color: #111111;
        }
        .admin-actions {
            display: flex;
            gap: 12px;
        }
        .btn-admin-primary {
            background-color: #D96328;
            color: #FFFFFF;
            border: none;
            padding: 10px 20px;
            border-radius: 999px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .btn-admin-primary:hover {
            background-color: #B84E1B;
        }
        .btn-admin-secondary {
            background-color: transparent;
            color: #4A463F;
            border: 1px solid #D8D2C6;
            padding: 10px 20px;
            border-radius: 999px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .btn-admin-secondary:hover {
            background-color: #FAF8F5;
            border-color: #111111;
        }
        .routes-table-card {
            background: #FFFFFF;
            border-radius: 12px;
            border: 1px solid #ECE7DE;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            overflow: hidden;
        }
        table.admin-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }
        table.admin-table th, table.admin-table td {
            padding: 16px 20px;
            border-bottom: 1px solid #F0ECE4;
            vertical-align: middle;
        }
        table.admin-table th {
            background-color: #FAF8F5;
            font-weight: 700;
            color: #555047;
            letter-spacing: 0.5px;
        }
        table.admin-table tr:last-child td {
            border-bottom: none;
        }
        .badge-id {
            background: #D96328;
            color: #FFFFFF;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 800;
        }
        .btn-danger {
            background: #C0392B;
            color: #FFFFFF;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-danger:hover {
            background: #962D22;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #8C867C;
        }
    </style>
</head>
<body class="admin-body">

    <div class="admin-container">
        <div class="admin-header">
            <div>
                <span style="font-size: 0.75rem; font-weight: 800; letter-spacing: 2px; color: #D96328;">ADMIN CONTROL PANEL</span>
                <h1 class="admin-title">走讀路線管理後台</h1>
            </div>
            <div class="admin-actions">
                <a href="itinerary.html" class="btn-admin-secondary">檢視路線前台 ↗</a>
                <button class="btn-admin-primary" id="btnAddRoute">＋ 新增路線方案</button>
            </div>
        </div>

        <div class="routes-table-card">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th style="width: 100px;">方案代碼</th>
                        <th style="width: 140px;">分頁標題</th>
                        <th>路線名稱與摘要</th>
                        <th style="width: 120px; text-align: right;">操作</th>
                    </tr>
                </thead>
                <tbody id="routesTableBody">
                    <tr>
                        <td colspan="4" class="empty-state">正在從 Supabase 載入走讀路線資料...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://iwdqccgeabktkqqrtahd.supabase.co/rest/v1/';
        const SUPABASE_ANON_KEY = 'sb_publishable_8xL7hdpdUuT5lwyNYnWsjw_701urNJ3';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchRoutes() {
            const tbody = document.getElementById('routesTableBody');
            const { data, error } = await supabase
                .from('routes')
                .select('*')
                .order('route_id', { ascending: true });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="4" class="empty-state" style="color: #C0392B;">載入失敗：${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="empty-state">目前尚無任何走讀路線資料。</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(item => `
                <tr>
                    <td><span class="badge-id">${item.route_id}</span></td>
                    <td><strong>${item.tab_title || ''}</strong></td>
                    <td>
                        <strong style="font-size: 1rem; display: block; margin-bottom: 4px;">${item.main_title}</strong>
                        <span style="color: #6E685F; font-size: 0.82rem; display: block; line-height: 1.4;">${item.summary || ''}</span>
                    </td>
                    <td style="text-align: right;">
                        <button class="btn-danger" onclick="deleteRoute('${item.route_id}')">刪除</button>
                    </td>
                </tr>
            `).join('');
        }

        async function deleteRoute(routeId) {
            if (!confirm(`確定要刪除方案 [${routeId}] 嗎？`)) return;
            const { error } = await supabase.from('routes').delete().eq('route_id', routeId);
            if (error) {
                alert('刪除失敗：' + error.message);
            } else {
                alert('刪除成功！');
                fetchRoutes();
            }
        }

        document.getElementById('btnAddRoute').addEventListener('click', async () => {
            const routeId = prompt('請輸入方案代碼 (例如 G 或 E)：');
            if (!routeId) return;
            const mainTitle = prompt('請輸入方案完整標題 (例如 G 創新體驗線)：');
            if (!mainTitle) return;

            const { error } = await supabase.from('routes').insert([
                {
                    route_id: routeId.toUpperCase(),
                    route_type: 'itinerary_1day',
                    eyebrow: `ROUTE ${routeId.toUpperCase()}`,
                    tab_title: '新創體驗線',
                    main_title: mainTitle,
                    keywords: '創新 × 體驗 × 探索',
                    summary: '請在此輸入此路線方案的簡介摘要...',
                    specs: {
                        track: '起點 ➔ 中繼站 ➔ 終點',
                        transport: '步行 ＋ 專車接駁',
                        highlight: '在地文史走讀 ＆ 風土手作體驗'
                    },
                    timeline: [
                        { time: "09:00 - 12:00", num: 1, title: "上午場域踏查與導覽", desc: "深入地方聚落進行深度導覽。", img: "assets/水道頭文創聚落.png" },
                        { time: "13:30 - 16:30", num: 2, title: "下午風土手作體驗", desc: "動手體驗在地傳統工藝與手作。", img: "assets/藍染體驗.png" }
                    ]
                }
            ]);

            if (error) {
                alert('新增失敗：' + error.message);
            } else {
                alert('新增成功！');
                fetchRoutes();
            }
        });

        document.addEventListener('DOMContentLoaded', fetchRoutes);
    </script>
</body>
</html>
