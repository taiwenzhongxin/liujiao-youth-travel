<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>走讀路線管理後台 ｜ 嘉義青年壯遊</title>
    
    <link rel="stylesheet" href="css/common.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@300;400;500;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body.admin-body {
            background-color: #F8F7F4;
            color: #1A1A1A;
            margin: 0;
            padding: 40px 20px;
            font-family: 'Noto Sans TC', sans-serif;
        }
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            border-bottom: 2px solid #E5E0D8;
            padding-bottom: 16px;
        }
        .admin-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.8rem;
            font-weight: 900;
            margin: 0;
            color: #111111;
        }
        .admin-actions {
            display: flex;
            gap: 12px;
        }
        .btn-admin-primary {
            background-color: #D96328;
            color: #FFFFFF;
            border: none;
            padding: 10px 20px;
            border-radius: 999px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .btn-admin-primary:hover {
            background-color: #B84E1B;
        }
        .btn-admin-secondary {
            background-color: transparent;
            color: #4A463F;
            border: 1px solid #D8D2C6;
            padding: 10px 20px;
            border-radius: 999px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .btn-admin-secondary:hover {
            background-color: #FAF8F5;
            border-color: #111111;
        }
        .routes-table-card {
            background: #FFFFFF;
            border-radius: 12px;
            border: 1px solid #ECE7DE;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            overflow: hidden;
        }
        table.admin-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }
        table.admin-table th, table.admin-table td {
            padding: 16px 20px;
            border-bottom: 1px solid #F0ECE4;
            vertical-align: middle;
        }
        table.admin-table th {
            background-color: #FAF8F5;
            font-weight: 700;
            color: #555047;
            letter-spacing: 0.5px;
        }
        table.admin-table tr:last-child td {
            border-bottom: none;
        }
        .badge-id {
            background: #D96328;
            color: #FFFFFF;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 800;
        }
        .btn-danger {
            background: #C0392B;
            color: #FFFFFF;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-danger:hover {
            background: #962D22;
        }
        .btn-edit {
            background: #27AE60;
            color: #FFFFFF;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-edit:hover {
            background: #1E8449;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #8C867C;
        }

        /* 彈窗卡片樣式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            overflow-y: auto;
            padding: 20px 0;
        }
        .modal-card {
            background: #FFFFFF;
            width: 100%;
            max-width: 600px;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            box-sizing: border-box;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-card h3 {
            margin-top: 0;
            font-family: 'Noto Serif TC', serif;
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #111;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: #4A463F;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #D8D2C6;
            border-radius: 8px;
            font-size: 0.9rem;
            box-sizing: border-box;
            font-family: inherit;
        }
        .form-group textarea {
            resize: vertical;
            height: 70px;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body class="admin-body">

    <div class="admin-container">
        <div class="admin-header">
            <div>
                <span style="font-size: 0.75rem; font-weight: 800; letter-spacing: 2px; color: #D96328;">ADMIN CONTROL PANEL</span>
                <h1 class="admin-title">走讀路線管理後台</h1>
            </div>
            <div class="admin-actions">
                <a href="admin.html" class="btn-admin-secondary">← 返回總後台</a>
                <a href="itinerary.html" class="btn-admin-secondary" target="_blank">檢視路線 ↗</a>
                <button class="btn-admin-primary" id="btnAddRoute">＋ 新增路線方案</button>
                <button class="btn-admin-secondary" id="logoutBtn" style="color: #C0392B; border-color: #C0392B;">登出</button>
            </div>
        </div>

        <div class="routes-table-card">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th style="width: 80px;">封面</th>
                        <th style="width: 90px;">方案代碼</th>
                        <th style="width: 130px;">分頁標題</th>
                        <th>路線名稱與摘要</th>
                        <th style="width: 130px; text-align: right;">操作</th>
                    </tr>
                </thead>
                <tbody id="routesTableBody">
                    <tr>
                        <td colspan="5" class="empty-state">正在驗證身分並載入走讀路線資料...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 互動卡片彈窗 (Modal) -->
    <div class="modal-overlay" id="routeModal">
        <div class="modal-card">
            <h3 id="modalTitle">新增路線方案</h3>
            <form id="routeForm">
                <div style="display: flex; gap: 12px;">
                    <div class="form-group" style="flex: 1;">
                        <label>方案代碼 (例如 G)</label>
                        <input type="text" id="routeIdInput" required placeholder="例如 G">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>分頁標題 (例如 新創體驗線)</label>
                        <input type="text" id="routeTabTitleInput" required placeholder="例如 新創體驗線">
                    </div>
                </div>
                <div style="display: flex; gap: 12px;">
                    <div class="form-group" style="flex: 1;">
                        <label>小標籤 (例如 ROUTE G)</label>
                        <input type="text" id="routeEyebrowInput" placeholder="例如 ROUTE G">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>關鍵字</label>
                        <input type="text" id="routeKeywordsInput" placeholder="例如 創新 × 體驗">
                    </div>
                </div>
                <div class="form-group">
                    <label>方案完整標題</label>
                    <input type="text" id="routeMainTitleInput" required placeholder="例如 G 創新體驗線">
                </div>
                <div class="form-group">
                    <label>路線簡介摘要</label>
                    <textarea id="routeSummaryInput" placeholder="請輸入路線簡介..."></textarea>
                </div>
                <div class="form-group">
                    <label>路線封面圖片 (上傳圖檔)</label>
                    <input type="file" id="routeImageFile" accept="image/*">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-admin-secondary" id="closeModalBtn">取消</button>
                    <button type="submit" class="btn-admin-primary" id="saveRouteBtn">儲存資料</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://jgidphbpizkladzzamyz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_miYTEZasCg_uBNOd0wlwNw_dwcP-hJk';
        
        window.db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isEditing = false;
        let currentImageUrl = '';

        async function checkAuthAndFetch() {
            const { data: { session } } = await window.db.auth.getSession();
            if (!session) {
                alert('您尚未登入或登入已過期，請先登入後台！');
                window.location.href = 'login.html';
                return;
            }
            fetchRoutes();
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await window.db.auth.signOut();
            window.location.href = 'login.html';
        });

        // 抓取路線資料
        async function fetchRoutes() {
            const tbody = document.getElementById('routesTableBody');
            const { data, error } = await window.db
                .from('routes')
                .select('*')
                .order('route_id', { ascending: true });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="5" class="empty-state" style="color: #C0392B;">載入失敗：${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="empty-state">目前尚無任何走讀路線資料。</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(item => `
                <tr>
                    <td>
                        ${item.image_url ? `<img src="${item.image_url}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 6px;" alt="封面">` : `<span style="color: #ccc; font-size: 0.8rem;">無圖</span>`}
                    </td>
                    <td><span class="badge-id">${item.route_id}</span></td>
                    <td><strong>${item.tab_title || ''}</strong></td>
                    <td>
                        <strong style="font-size: 1rem; display: block; margin-bottom: 4px;">${item.main_title}</strong>
                        <span style="color: #6E685F; font-size: 0.82rem; display: block; line-height: 1.4;">${item.summary || ''}</span>
                    </td>
                    <td style="text-align: right;">
                        <button class="btn-edit" onclick="openEditModal('${item.route_id}')">修改</button>
                        <button class="btn-danger" onclick="deleteRoute('${item.route_id}')">刪除</button>
                    </td>
                </tr>
            `).join('');
        }

        // 刪除路線
        window.deleteRoute = async function(routeId) {
            if (!confirm(`確定要刪除方案 [${routeId}] 嗎？`)) return;
            const { error } = await window.db.from('routes').delete().eq('route_id', routeId);
            if (error) {
                alert('刪除失敗：' + error.message);
            } else {
                alert('刪除成功！');
                fetchRoutes();
            }
        };

        // 上傳檔案至 Supabase Storage
        async function uploadFileToStorage(file) {
            if (!file) return null;
            const fileExt = file.name.split('.').pop();
            const fileName = `route_${Math.random().toString(36).substring(2)}_${Date.now()}.${fileExt}`;
            const filePath = `routes-covers/${fileName}`;

            const { error } = await window.db.storage
                .from('spot-images') // 共用 spot-images 儲存桶
                .upload(filePath, file);

            if (error) {
                alert('圖片上傳失敗：' + error.message);
                return null;
            }

            const { data: { publicUrl } } = window.db.storage
                .from('spot-images')
                .getPublicUrl(filePath);

            return publicUrl;
        }

        // 彈窗控制
        const modal = document.getElementById('routeModal');
        const btnAddRoute = document.getElementById('btnAddRoute');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const routeForm = document.getElementById('routeForm');

        btnAddRoute.addEventListener('click', () => {
            isEditing = false;
            currentImageUrl = '';
            document.getElementById('modalTitle').innerText = '新增路線方案';
            document.getElementById('routeIdInput').value = '';
            document.getElementById('routeIdInput').disabled = false;
            document.getElementById('routeTabTitleInput').value = '新創體驗線';
            document.getElementById('routeEyebrowInput').value = 'ROUTE G';
            document.getElementById('routeKeywordsInput').value = '創新 × 體驗 × 探索';
            document.getElementById('routeMainTitleInput').value = '';
            document.getElementById('routeSummaryInput').value = '';
            document.getElementById('routeImageFile').value = '';
            
            modal.style.display = 'flex';
        });

        // 開啟修改彈窗
        window.openEditModal = async function(routeId) {
            const { data, error } = await window.db.from('routes').select('*').eq('route_id', routeId).single();
            if (error || !data) {
                alert('找不到該路線資料');
                return;
            }

            isEditing = true;
            currentImageUrl = data.image_url || '';
            document.getElementById('modalTitle').innerText = `修改路線：${data.route_id}`;
            document.getElementById('routeIdInput').value = data.route_id;
            document.getElementById('routeIdInput').disabled = true; // 主鍵代碼不可修改
            document.getElementById('routeTabTitleInput').value = data.tab_title || '';
            document.getElementById('routeEyebrowInput').value = data.eyebrow || '';
            document.getElementById('routeKeywordsInput').value = data.keywords || '';
            document.getElementById('routeMainTitleInput').value = data.main_title || '';
            document.getElementById('routeSummaryInput').value = data.summary || '';
            document.getElementById('routeImageFile').value = '';

            modal.style.display = 'flex';
        };

        closeModalBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        // 表單送出 (新增或修改)
        routeForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const route_id = document.getElementById('routeIdInput').value.trim().toUpperCase();
            const tab_title = document.getElementById('routeTabTitleInput').value.trim();
            const eyebrow = document.getElementById('routeEyebrowInput').value.trim();
            const keywords = document.getElementById('routeKeywordsInput').value.trim();
            const main_title = document.getElementById('routeMainTitleInput').value.trim();
            const summary = document.getElementById('routeSummaryInput').value.trim();
            const imageFile = document.getElementById('routeImageFile').files[0];

            let finalImageUrl = currentImageUrl;
            if (imageFile) {
                const uploadedUrl = await uploadFileToStorage(imageFile);
                if (uploadedUrl) finalImageUrl = uploadedUrl;
            }

            if (isEditing) {
                const { error } = await window.db.from('routes').update({
                    tab_title, eyebrow, keywords, main_title, summary,
                    image_url: finalImageUrl
                }).eq('route_id', route_id);

                if (error) {
                    alert('修改失敗：' + error.message);
                } else {
                    alert('修改成功！');
                    modal.style.display = 'none';
                    fetchRoutes();
                }
            } else {
                const { error } = await window.db.from('routes').insert([{
                    route_id, tab_title, eyebrow, keywords, main_title, summary,
                    image_url: finalImageUrl,
                    route_type: 'itinerary_1day',
                    specs: { track: '起點 ➔ 終點', transport: '步行 ＋ 專車', highlight: '在地文史走讀' },
                    timeline: []
                }]);

                if (error) {
                    alert('新增失敗（可能代碼重複）：' + error.message);
                } else {
                    alert('新增成功！');
                    modal.style.display = 'none';
                    fetchRoutes();
                }
            }
        });

        document.addEventListener('DOMContentLoaded', checkAuthAndFetch);
    </script>
</body>
</html>
