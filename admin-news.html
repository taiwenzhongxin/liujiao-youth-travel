<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最新消息管理後台 ｜ 嘉義青年壯遊</title>
    
    <link rel="stylesheet" href="css/common.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@300;400;500;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body.admin-body {
            background-color: #F8F7F4;
            color: #1A1A1A;
            margin: 0;
            padding: 40px 20px;
            font-family: 'Noto Sans TC', sans-serif;
        }
        .admin-container {
            max-width: 1100px;
            margin: 0 auto;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            border-bottom: 2px solid #E5E0D8;
            padding-bottom: 16px;
        }
        .admin-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.8rem;
            font-weight: 900;
            margin: 0;
            color: #111111;
        }
        .admin-actions {
            display: flex;
            gap: 12px;
        }
        .btn-admin-primary {
            background-color: #D96328;
            color: #FFFFFF;
            border: none;
            padding: 10px 20px;
            border-radius: 999px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .btn-admin-primary:hover {
            background-color: #B84E1B;
        }
        .btn-admin-secondary {
            background-color: transparent;
            color: #4A463F;
            border: 1px solid #D8D2C6;
            padding: 10px 20px;
            border-radius: 999px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .btn-admin-secondary:hover {
            background-color: #FAF8F5;
            border-color: #111111;
        }
        .news-table-card {
            background: #FFFFFF;
            border-radius: 12px;
            border: 1px solid #ECE7DE;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            overflow: hidden;
        }
        table.admin-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }
        table.admin-table th, table.admin-table td {
            padding: 16px 20px;
            border-bottom: 1px solid #F0ECE4;
            vertical-align: middle;
        }
        table.admin-table th {
            background-color: #FAF8F5;
            font-weight: 700;
            color: #555047;
            letter-spacing: 0.5px;
        }
        table.admin-table tr:last-child td {
            border-bottom: none;
        }
        .badge-cat {
            background: #FDEEE6;
            color: #D96328;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .btn-danger {
            background: #C0392B;
            color: #FFFFFF;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-danger:hover {
            background: #962D22;
        }
        .btn-edit {
            background: #27AE60;
            color: #FFFFFF;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-edit:hover {
            background: #1E8449;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #8C867C;
        }

        /* 互動卡片彈窗 (Modal) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            overflow-y: auto;
            padding: 20px 0;
        }
        .modal-card {
            background: #FFFFFF;
            width: 100%;
            max-width: 550px;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            box-sizing: border-box;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-card h3 {
            margin-top: 0;
            font-family: 'Noto Serif TC', serif;
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #111;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #4A463F;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #D8D2C6;
            border-radius: 8px;
            font-size: 0.95rem;
            box-sizing: border-box;
            font-family: inherit;
        }
        .form-group textarea {
            resize: vertical;
            height: 90px;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 24px;
        }
    </style>
</head>
<body class="admin-body">

    <div class="admin-container">
        <div class="admin-header">
            <div>
                <span style="font-size: 0.75rem; font-weight: 800; letter-spacing: 2px; color: #D96328;">ADMIN CONTROL PANEL</span>
                <h1 class="admin-title">最新消息管理後台</h1>
            </div>
            <div class="admin-actions">
                <a href="admin.html" class="btn-admin-secondary">← 返回總後台</a>
                <a href="news.html" class="btn-admin-secondary" target="_blank">檢視前台 ↗</a>
                <button class="btn-admin-primary" id="btnAddNews" type="button">＋ 新增文章</button>
                <button class="btn-admin-secondary" id="logoutBtn" style="color: #C0392B; border-color: #C0392B;">登出</button>
            </div>
        </div>

        <div class="news-table-card">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th style="width: 110px;">日期</th>
                        <th style="width: 120px;">分類</th>
                        <th>文章標題與摘要</th>
                        <th style="width: 140px; text-align: right;">操作</th>
                    </tr>
                </thead>
                <tbody id="newsTableBody">
                    <tr>
                        <td colspan="4" class="empty-state">正在驗證身分並載入最新消息資料...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 互動卡片彈窗 (Modal) -->
    <div class="modal-overlay" id="newsModal">
        <div class="modal-card">
            <h3 id="modalTitle">新增最新消息</h3>
            <form id="newsForm">
                <input type="hidden" id="newsIdInput">
                <div class="form-group">
                    <label>發布日期 (例如 2026.08.15)</label>
                    <input type="text" id="newsDateInput" required placeholder="請輸入日期">
                </div>
                <div class="form-group">
                    <label>分類</label>
                    <select id="newsCategoryInput" required style="width: 100%; padding: 10px 14px; border: 1px solid #D8D2C6; border-radius: 8px; font-size: 0.95rem; box-sizing: border-box; font-family: inherit; background-color: #FFFFFF; color: #1A1A1A; cursor: pointer;">
                        <option value="活動資訊">活動資訊</option>
                        <option value="地方新聞">地方新聞</option>
                        <option value="團隊動態">團隊動態</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>文章標題</label>
                    <input type="text" id="newsTitleInput" required placeholder="請輸入文章標題">
                </div>
                <div class="form-group">
                    <label>摘要說明</label>
                    <textarea id="newsSummaryInput" placeholder="請輸入文章摘要內容..."></textarea>
                </div>
                <div class="form-group">
                    <label>代表圖片 (上傳圖檔)</label>
                    <input type="file" id="newsImageFile" accept="image/*">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-admin-secondary" id="closeModalBtn">取消</button>
                    <button type="submit" class="btn-admin-primary" id="saveNewsBtn">儲存資料</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 載入 Supabase Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://jgidphbpizkladzzamyz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_miYTEZasCg_uBNOd0wlwNw_dwcP-hJk';
        
        window.db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isEditing = false;
        let currentImageUrl = '';

        async function checkAuthAndFetch() {
            const { data: { session } } = await window.db.auth.getSession();
            if (!session) {
                alert('您尚未登入或登入已過期，請先登入後台！');
                window.location.href = 'login.html';
                return;
            }
            fetchNews();
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await window.db.auth.signOut();
            window.location.href = 'login.html';
        });

        // 抓取資料並渲染
        async function fetchNews() {
            const tbody = document.getElementById('newsTableBody');
            if (!tbody) return;

            const { data, error } = await window.db
                .from('news')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="4" class="empty-state" style="color: #C0392B;">載入失敗：${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="empty-state">目前尚無任何最新消息資料。</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(item => `
                <tr>
                    <td>${item.date || ''}</td>
                    <td><span class="badge-cat">${item.category || '未分類'}</span></td>
                    <td>
                        <strong style="font-size: 1rem; display: block; margin-bottom: 4px;">${item.title || ''}</strong>
                        <span style="color: #6E685F; font-size: 0.82rem; display: block; line-height: 1.4;">${item.summary || ''}</span>
                    </td>
                    <td style="text-align: right;">
                        <button class="btn-edit" onclick="openEditModal(${item.id})">修改</button>
                        <button class="btn-danger" onclick="deleteNews(${item.id})">刪除</button>
                    </td>
                </tr>
            `).join('');
        }

        // 刪除文章
        window.deleteNews = async function(id) {
            if (!confirm('確定要刪除這筆最新消息嗎？')) return;
            const { error } = await window.db.from('news').delete().eq('id', id);
            if (error) {
                alert('刪除失敗：' + error.message);
            } else {
                alert('刪除成功！');
                fetchNews();
            }
        };

        // 上傳圖片到 Supabase Storage
        async function uploadFileToStorage(file) {
            if (!file) return null;
            const fileExt = file.name.split('.').pop();
            const fileName = `news_${Math.random().toString(36).substring(2)}_${Date.now()}.${fileExt}`;
            const filePath = `news-covers/${fileName}`;

            const { error } = await window.db.storage
                .from('spot-images') // 共用 spot-images 儲存桶
                .upload(filePath, file);

            if (error) {
                alert('圖片上傳失敗：' + error.message);
                return null;
            }

            const { data: { publicUrl } } = window.db.storage
                .from('spot-images')
                .getPublicUrl(filePath);

            return publicUrl;
        }

        // 彈窗表單控制
        const modal = document.getElementById('newsModal');
        const btnAddNews = document.getElementById('btnAddNews');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const newsForm = document.getElementById('newsForm');

        btnAddNews.addEventListener('click', () => {
            isEditing = false;
            currentImageUrl = '';
            document.getElementById('modalTitle').innerText = '新增最新消息';
            document.getElementById('newsIdInput').value = '';
            
            // 自動帶入今天的日期 (格式如 2026.08.15)
            const today = new Date().toISOString().slice(0, 10).replace(/-/g, '.');
            document.getElementById('newsDateInput').value = today;
            document.getElementById('newsCategoryInput').value = '活動資訊';
            document.getElementById('newsTitleInput').value = '';
            document.getElementById('newsSummaryInput').value = '';
            document.getElementById('newsImageFile').value = '';
            
            modal.style.display = 'flex';
        });

        // 開啟修改彈窗
        window.openEditModal = async function(id) {
            const { data, error } = await window.db.from('news').select('*').eq('id', id).single();
            if (error || !data) {
                alert('找不到該文章資料');
                return;
            }

            isEditing = true;
            currentImageUrl = data.image_url || '';
            document.getElementById('modalTitle').innerText = `修改文章 (ID: ${data.id})`;
            document.getElementById('newsIdInput').value = data.id;
            document.getElementById('newsDateInput').value = data.date || '';
            document.getElementById('newsCategoryInput').value = data.category || '';
            document.getElementById('newsTitleInput').value = data.title || '';
            document.getElementById('newsSummaryInput').value = data.summary || '';
            document.getElementById('newsImageFile').value = '';
            
            modal.style.display = 'flex';
        };

        closeModalBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        // 表單送出 (新增或修改)
        newsForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('newsIdInput').value;
            const date = document.getElementById('newsDateInput').value.trim();
            const category = document.getElementById('newsCategoryInput').value.trim();
            const title = document.getElementById('newsTitleInput').value.trim();
            const summary = document.getElementById('newsSummaryInput').value.trim();
            const imageFile = document.getElementById('newsImageFile').files[0];

            let finalImageUrl = currentImageUrl;
            if (imageFile) {
                const uploadedUrl = await uploadFileToStorage(imageFile);
                if (uploadedUrl) finalImageUrl = uploadedUrl;
            }

            if (isEditing) {
                const { error } = await window.db.from('news').update({
                    date, category, title, summary,
                    image_url: finalImageUrl
                }).eq('id', id);

                if (error) {
                    alert('修改失敗：' + error.message);
                } else {
                    alert('修改成功！');
                    modal.style.display = 'none';
                    fetchNews();
                }
            } else {
                const { error } = await window.db.from('news').insert([{
                    date, category, title, summary,
                    image_url: finalImageUrl
                }]);

                if (error) {
                    alert('新增失敗：' + error.message);
                } else {
                    alert('新增成功！');
                    modal.style.display = 'none';
                    fetchNews();
                }
            }
        });

        document.addEventListener('DOMContentLoaded', checkAuthAndFetch);
    </script>
</body>
</html>
