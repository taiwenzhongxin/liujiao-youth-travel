<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>壯遊據點管理後台 ｜ 嘉義青年壯遊</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@300;400;500;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body.admin-body {
            background-color: #F8F7F4;
            color: #1A1A1A;
            margin: 0;
            padding: 40px 20px;
            font-family: 'Noto Sans TC', sans-serif;
        }
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            border-bottom: 2px solid #E5E0D8;
            padding-bottom: 16px;
        }
        .admin-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.8rem;
            font-weight: 900;
            margin: 0;
            color: #111111;
        }
        .admin-actions {
            display: flex;
            gap: 12px;
        }
        .btn-admin-primary {
            background-color: #D96328;
            color: #FFFFFF;
            border: none;
            padding: 10px 20px;
            border-radius: 999px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .btn-admin-primary:hover {
            background-color: #B84E1B;
        }
        .btn-admin-secondary {
            background-color: transparent;
            color: #4A463F;
            border: 1px solid #D8D2C6;
            padding: 10px 20px;
            border-radius: 999px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .btn-admin-secondary:hover {
            background-color: #FAF8F5;
            border-color: #111111;
        }
        .spots-table-card {
            background: #FFFFFF;
            border-radius: 12px;
            border: 1px solid #ECE7DE;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            overflow: hidden;
        }
        table.admin-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }
        table.admin-table th, table.admin-table td {
            padding: 16px 20px;
            border-bottom: 1px solid #F0ECE4;
            vertical-align: middle;
        }
        table.admin-table th {
            background-color: #FAF8F5;
            font-weight: 700;
            color: #555047;
            letter-spacing: 0.5px;
        }
        table.admin-table tr:last-child td {
            border-bottom: none;
        }
        .badge-id {
            background: #D96328;
            color: #FFFFFF;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 800;
        }
        .btn-danger {
            background: #C0392B;
            color: #FFFFFF;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-danger:hover {
            background: #962D22;
        }
        .btn-edit {
            background: #27AE60;
            color: #FFFFFF;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-edit:hover {
            background: #1E8449;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #8C867C;
        }

        /* 彈窗卡片樣式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            overflow-y: auto;
            padding: 20px 0;
        }
        .modal-card {
            background: #FFFFFF;
            width: 100%;
            max-width: 650px;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            box-sizing: border-box;
            max-height: 92vh;
            overflow-y: auto;
        }
        .modal-card h3 {
            margin-top: 0;
            font-family: 'Noto Serif TC', serif;
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #111;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: #4A463F;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #D8D2C6;
            border-radius: 8px;
            font-size: 0.9rem;
            box-sizing: border-box;
            font-family: inherit;
        }
        .form-group textarea {
            resize: vertical;
            height: 60px;
        }

        /* 自定義圖片點選容器 */
        .map-picker-container {
            position: relative;
            width: 100%;
            cursor: crosshair;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #D8D2C6;
            background: #eee;
        }
        .map-picker-container img {
            width: 100%;
            display: block;
        }
        /* 點下去產生的紅點標記 */
        .map-pin {
            position: absolute;
            width: 16px;
            height: 16px;
            background: #D96328;
            border: 2px solid #FFFFFF;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            pointer-events: none;
            display: none;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body class="admin-body">

    <div class="admin-container">
        <div class="admin-header">
            <div>
                <span style="font-size: 0.75rem; font-weight: 800; letter-spacing: 2px; color: #D96328;">ADMIN CONTROL PANEL</span>
                <h1 class="admin-title">壯遊據點管理後台</h1>
            </div>
            <div class="admin-actions">
                <a href="admin.html" class="btn-admin-secondary">← 返回總後台</a>
                <a href="spots.html" class="btn-admin-secondary" target="_blank">檢視前台 ↗</a>
                <button class="btn-admin-primary" id="btnAddSpot">＋ 新增據點</button>
                <button class="btn-admin-secondary" id="logoutBtn" style="color: #C0392B; border-color: #C0392B;">登出</button>
            </div>
        </div>

        <div class="spots-table-card">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th style="width: 80px;">圖片</th>
                        <th style="width: 90px;">英文代碼</th>
                        <th style="width: 120px;">鄉鎮 / 分類</th>
                        <th>據點名稱與短評摘要</th>
                        <th style="width: 130px; text-align: right;">操作</th>
                    </tr>
                </thead>
                <tbody id="spotsTableBody">
                    <!-- 這裡保持空白，完全由 Supabase 帶入 -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- 互動卡片彈窗 (Modal) -->
    <div class="modal-overlay" id="spotModal">
        <div class="modal-card">
            <h3 id="modalTitle">新增據點</h3>
            <form id="spotForm">
                <div style="display: flex; gap: 12px;">
                    <div class="form-group" style="flex: 1;">
                        <label>據點英文代碼 (例如 spot_02)</label>
                        <input type="text" id="spotIdInput" required placeholder="請輸入英文代碼">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>鄉鎮</label>
                        <input type="text" id="spotTownInput" required placeholder="例如 六腳鄉">
                    </div>
                </div>
                <div style="display: flex; gap: 12px;">
                    <div class="form-group" style="flex: 1;">
                        <label>分類</label>
                        <select id="spotCategoryInput" required>
                            <option value="產業與歷史">產業與歷史</option>
                            <option value="傳統手工藝">傳統手工藝</option>
                            <option value="常民與市井">常民與市井</option>
                            <option value="創新與社群">創新與社群</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>據點名稱</label>
                        <input type="text" id="spotTitleInput" required placeholder="請輸入據點名稱">
                    </div>
                </div>
                <div class="form-group">
                    <label>短評摘要說明</label>
                    <textarea id="spotSummaryInput" placeholder="請輸入據點摘要內容..."></textarea>
                </div>
                
                <!-- 自定義插畫地圖點選區塊 -->
                <div class="form-group">
                    <label>地圖點位設定 (請直接在下方插畫地圖上點擊該據點位置)</label>
                    <div style="display: flex; gap: 10px; margin-bottom: 6px;">
    <!-- 移除 readonly，讓使用者也可以手動微調數字 -->
    <input type="text" id="spotLatInput" placeholder="X 座標 (%)">
    <input type="text" id="spotLngInput" placeholder="Y 座標 (%)">
</div>
                    <div class="map-picker-container" id="mapPickerBox">
                        <img src="assets/map.png" alt="插畫地圖" id="pickerMapImg">
                        <div class="map-pin" id="mapPin"></div>
                    </div>
                </div>

                <div style="display: flex; gap: 12px;">
                    <div class="form-group" style="flex: 1;">
                        <label>代表圖片</label>
                        <input type="file" id="spotImageFile" accept="image/*">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>小插圖 (Icon)</label>
                        <input type="file" id="spotIconFile" accept="image/*">
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-admin-secondary" id="closeModalBtn">取消</button>
                    <button type="submit" class="btn-admin-primary" id="saveSpotBtn">儲存資料</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://jgidphbpizkladzzamyz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_miYTEZasCg_uBNOd0wlwNw_dwcP-hJk';

        window.db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let isEditing = false;
        let currentImageUrl = '';
        let currentIconUrl = '';

        async function checkAuthAndFetch() {
            fetchSpotsTable();
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await window.db.auth.signOut();
            window.location.href = 'login.html';
        });

        // 抓取表格資料
        async function fetchSpotsTable() {
            const tbody = document.getElementById('spotsTableBody');
            if (!tbody) return;

            const { data, error } = await window.db
                .from('spots')
                .select('*')
                .order('title', { ascending: true });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="5" class="empty-state" style="color: #C0392B;">載入失敗：${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="empty-state">目前尚無任何壯遊據點資料。</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(item => `
                <tr>
                    <td>
                        ${item.image_url ? `<img src="${item.image_url}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 6px;" alt="預覽">` : `<span style="color: #ccc; font-size: 0.8rem;">無圖</span>`}
                    </td>
                    <td><span class="badge-id">${item.id || ''}</span></td>
                    <td>
                        <strong>${item.town || ''}</strong><br>
                        <span style="background: #FDEEE6; color: #D96328; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 700;">${item.category || ''}</span>
                    </td>
                    <td>
                        <strong style="font-size: 1rem; display: block; margin-bottom: 4px;">${item.title || ''}</strong>
                        <span style="color: #6E685F; font-size: 0.82rem; display: block; line-height: 1.4;">${item.summary || ''}</span>
                    </td>
                    <td style="text-align: right;">
                        <button class="btn-edit" onclick="openEditModal('${item.id}')">修改</button>
                        <button class="btn-danger" onclick="deleteSpot('${item.id}')">刪除</button>
                    </td>
                </tr>
            `).join('');
        }

window.deleteSpot = async function(id) {
    console.log("準備刪除 ID:", id);
    if (!confirm(`確定要刪除據點 [${id}] 嗎？`)) return;

    // 加入 .select() 讓 Supabase 回傳被刪除的資料
    const { data, error, count } = await window.db
        .from('spots')
        .delete()
        .eq('id', id)
        .select();

    console.log("Supabase 回傳結果 - error:", error);
    console.log("Supabase 回傳結果 - 被刪除的資料:", data);

    if (error) {
        alert('刪除失敗：' + error.message);
    } else if (!data || data.length === 0) {
        alert('警告：雖然沒報錯，但資料庫中找不到這筆 ID，或者沒有任何資料被刪除！');
    } else {
        alert('刪除成功！');
        fetchSpotsTable();
    }
};

        // 上傳檔案至 Supabase Storage
        async function uploadFileToStorage(file, folder) {
            if (!file) return null;
            const fileExt = file.name.split('.').pop();
            const fileName = `${Math.random().toString(36).substring(2)}_${Date.now()}.${fileExt}`;
            const filePath = `${folder}/${fileName}`;

            const { data, error } = await window.db.storage
                .from('spot-images')
                .upload(filePath, file);

            if (error) {
                alert('圖片上傳失敗：' + error.message);
                return null;
            }

            const { data: { publicUrl } } = window.db.storage
                .from('spot-images')
                .getPublicUrl(filePath);

            return publicUrl;
        }

        // 設定地圖點擊互動
        const mapPickerBox = document.getElementById('mapPickerBox');
        const mapPin = document.getElementById('mapPin');

        // 手動輸入座標時，紅點同步移動
        document.getElementById('spotLatInput').addEventListener('input', updatePinFromInputs);
        document.getElementById('spotLngInput').addEventListener('input', updatePinFromInputs);

        function updatePinFromInputs() {
            const x = parseFloat(document.getElementById('spotLatInput').value);
            const y = parseFloat(document.getElementById('spotLngInput').value);
            
            if (!isNaN(x) && !isNaN(y)) {
                mapPin.style.left = `${x}%`;
                mapPin.style.top = `${y}%`;
                mapPin.style.display = 'block';
            } else {
                mapPin.style.display = 'none';
            }
        }

        mapPickerBox.addEventListener('click', (e) => {
            const rect = mapPickerBox.getBoundingClientRect();
            const xClick = e.clientX - rect.left;
            const yClick = e.clientY - rect.top;

            const xPercent = ((xClick / rect.width) * 100).toFixed(2);
            const yPercent = ((yClick / rect.height) * 100).toFixed(2);

            document.getElementById('spotLatInput').value = xPercent; // 借用 lat 欄位存 X%
            document.getElementById('spotLngInput').value = yPercent; // 借用 lng 欄位存 Y%

            mapPin.style.left = `${xPercent}%`;
            mapPin.style.top = `${yPercent}%`;
            mapPin.style.display = 'block';
        });

        function setPinByPercent(x, y) {
            if (x && y) {
                document.getElementById('spotLatInput').value = x;
                document.getElementById('spotLngInput').value = y;
                mapPin.style.left = `${x}%`;
                mapPin.style.top = `${y}%`;
                mapPin.style.display = 'block';
            } else {
                document.getElementById('spotLatInput').value = '';
                document.getElementById('spotLngInput').value = '';
                mapPin.style.display = 'none';
            }
        }

        // 開啟新增卡片
        const modal = document.getElementById('spotModal');
        const btnAddSpot = document.getElementById('btnAddSpot');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const spotForm = document.getElementById('spotForm');

        btnAddSpot.addEventListener('click', () => {
            isEditing = false;
            currentImageUrl = '';
            currentIconUrl = '';
            document.getElementById('modalTitle').innerText = '新增據點';
            document.getElementById('spotIdInput').value = '';
            document.getElementById('spotIdInput').disabled = false;
            document.getElementById('spotTownInput').value = '六腳鄉';
            document.getElementById('spotCategoryInput').value = '在地文化';
            document.getElementById('spotTitleInput').value = '';
            document.getElementById('spotSummaryInput').value = '';
            document.getElementById('spotImageFile').value = '';
            document.getElementById('spotIconFile').value = '';
            
            setPinByPercent(null, null);
            modal.style.display = 'flex';
        });

        // 開啟修改卡片
        window.openEditModal = async function(id) {
            console.log("準備修改的據點 ID:", JSON.stringify(id)); // 印出乾淨的 ID 檢查有沒有空白
            const { data, error } = await window.db.from('spots').select('*').eq('id', id.trim()).single();
            if (error || !data) {
                alert('找不到該據點資料: ' + (error ? error.message : ''));
                return;
            }

            isEditing = true;
            currentImageUrl = data.image_url || '';
            currentIconUrl = data.icon_url || '';
            document.getElementById('modalTitle').innerText = `修改據點：${data.id}`;
            document.getElementById('spotIdInput').value = data.id.trim();
            document.getElementById('spotIdInput').disabled = true;
            document.getElementById('spotTownInput').value = data.town || '';
            document.getElementById('spotCategoryInput').value = data.category || '';
            document.getElementById('spotTitleInput').value = data.title || '';
            document.getElementById('spotSummaryInput').value = data.summary || '';
            document.getElementById('spotImageFile').value = '';
            document.getElementById('spotIconFile').value = '';

            modal.style.display = 'flex';
            setPinByPercent(data.lat, data.lng); 
        };

        closeModalBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        // 表單送出 (儲存新增或修改)
        spotForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('spotIdInput').value.trim();
            const town = document.getElementById('spotTownInput').value.trim();
            const category = document.getElementById('spotCategoryInput').value.trim();
            const title = document.getElementById('spotTitleInput').value.trim();
            const summary = document.getElementById('spotSummaryInput').value.trim();
            
            const lat = parseFloat(document.getElementById('spotLatInput').value) || 50; // X%
            const lng = parseFloat(document.getElementById('spotLngInput').value) || 50; // Y%

            const imageFile = document.getElementById('spotImageFile').files[0];
            const iconFile = document.getElementById('spotIconFile').files[0];

            let finalImageUrl = currentImageUrl;
            let finalIconUrl = currentIconUrl;

            if (imageFile) {
                const uploadedUrl = await uploadFileToStorage(imageFile, 'covers');
                if (uploadedUrl) finalImageUrl = uploadedUrl;
            }

            if (iconFile) {
                const uploadedUrl = await uploadFileToStorage(iconFile, 'icons');
                if (uploadedUrl) finalIconUrl = uploadedUrl;
            }

            if (isEditing) {
                const updatePayload = {
                    town, category, title, summary, lat, lng,
                    image_url: finalImageUrl,
                    icon_url: finalIconUrl
                };

                // 移除 .select()，改用純粹的 update
                const { error } = await window.db
                    .from('spots')
                    .update(updatePayload)
                    .eq('id', id);

                if (error) {
                    alert('修改失敗：' + error.message);
                } else {
                    alert('修改成功！');
                    modal.style.display = 'none';
                    fetchSpotsTable(); // 重新整理表格，會直接從資料庫抓取最新資料！
                }
            } else {
                const { error } = await window.db.from('spots').insert([{
                    id, town, category, title, summary, lat, lng,
                    image_url: finalImageUrl,
                    icon_url: finalIconUrl
                }]);

                if (error) {
                    alert('新增或英文代碼重複：' + error.message);
                } else {
                    alert('新增成功！');
                    modal.style.display = 'none';
                    fetchSpotsTable();
                }
            }
        });

        document.addEventListener('DOMContentLoaded', checkAuthAndFetch);
    </script>
</body>
</html>
